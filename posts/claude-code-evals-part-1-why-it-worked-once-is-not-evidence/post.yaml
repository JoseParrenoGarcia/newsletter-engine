series_position: 1

# ── Core content ──────────────────────────────────────────────────────
thesis: "Claude Code is not just answering questions — it is acting inside an environment. A single impressive run tells you nothing about reliability. The same discipline that makes software engineers write unit tests must be applied to agents, or you cannot measure quality, iterate safely, manage costs, or prevent the same failure from surprising you twice."
target_audience: "Engineers, technical managers, and technical PMs who are building with Claude Code or evaluating agents but have not yet thought seriously about evals. Comfortable with AI and software engineering; new to the discipline of agent evaluation."
target_reading_time_minutes: 15
topics_to_cover:
  - "The false comfort of one good run — LLMs are probabilistic, so a single success is not evidence"
  - "The unit test analogy — why software engineers test by discipline, not because they think the code is broken, and why that discipline disappears with agents"
  - "The iteration problem — if you revise a skill or prompt, how do you know it got better and not just different?"
  - "The cost management angle — can Haiku replace Sonnet for this task? You cannot answer that without evals"
  - "What an eval actually is — demystify the concept without going into how to build one"
  - "Claude Code as an acting system, not a chat interface — files changed, commands run, tools called, hooks fired"
  - "Failure modes that motivate evals — concrete scenarios painting real-life examples"
  - "The thinking reframe — evals mostly require human thinking, which is exactly what we are starting to outsource to agents"
  - "Light forward pointer — the how is not that difficult, and future posts will cover it"
topics_to_exclude:
  - "How to build evals (saved for Part 3)"
  - "Specific eval frameworks like RAGAS, Inspect, or LangSmith in depth (light-touch reference only if needed)"
  - "Evaluation surfaces taxonomy (saved for Part 2)"
  - "Harness infrastructure, YAML configs, LLM-as-judge prompts"
open_research_questions:
  - "Best external reference for the unit-test discipline analogy in the context of agents"
  - "Strong real-world example of a Claude Code skill that passes visually but fails on re-run or model swap"
  - "Any published data on LLM output variance across runs on identical prompts (to ground the probabilistic argument)"

# ── Brainstorm output ─────────────────────────────────────────────────
brainstorm_summary: "Part 1 is a mental-model essay — its job is to install the 'why' before Parts 2 and 3 deliver the map and the method. The sharpest hook is the unit-test analogy: software engineers write tests by discipline, not because they believe their code is broken, yet that discipline evaporates the moment the same engineer starts building agents. This is the missing mental model the post must correct. The argument builds from false comfort (it worked once) through the probabilistic nature of LLMs (how do you measure quality when output varies?) to the iteration problem (how do you know a revised skill is better, not just different?) and the cost management use case (can Haiku replace Sonnet here? — a question that cannot be answered without evals). The tone is 'here's a mental model you're missing' — analytical and direct, not a personal narrative. The reader should finish Part 1 understanding clearly why evals are necessary, not yet knowing how to build them."


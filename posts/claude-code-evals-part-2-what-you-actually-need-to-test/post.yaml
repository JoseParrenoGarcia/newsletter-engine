# ── Core content ──────────────────────────────────────────────────────
thesis: "The output check is necessary but not sufficient. A Claude Code workflow exposes nine distinct evaluation surfaces — final output, repository state, tool use, trajectory, skills, agents, hooks, cost/latency, and human usefulness — and testing only the first misses the majority of real failure modes."
target_audience: "Engineers and technical leads using Claude Code in production workflows; anyone building or evaluating Claude Code skills, subagents, or hooks"
target_reading_time_minutes: 20
topics_to_cover:
  - Nine evaluation surfaces for Claude Code workflows
  - Final output evals (necessary but not sufficient)
  - Repository state evals (file path, side effects)
  - Tool-use evals (transcript assertions, process vs product)
  - Trajectory evals (path quality, efficiency)
  - Skill evals — three forms: trigger, negative trigger, execution
  - Agent/subagent delegation evals (wrong delegation, bad integration)
  - Hook and command evals (control-plane vs output-quality)
  - Cost and latency evals (model routing with evidence)
  - Human usefulness evals (plausible-but-wrong failure mode)
  - A/B test document skill as running example throughout
topics_to_exclude:
  - How to build or run an eval suite (that is Part 3)
  - Deep implementation details of any specific eval framework
open_research_questions: []

# ── Brainstorm output ─────────────────────────────────────────────────
brainstorm_summary: "Part 2 maps the nine evaluation surfaces exposed by a Claude Code workflow. The running example (A/B test document skill from Part 1) is extended surface by surface to show what each eval catches that the others cannot. Key pedagogical goal: make the reader feel the gap between 'output looks right' and 'workflow is trustworthy'."


# ── Core content ──────────────────────────────────────────────────────
thesis: "The final document is only one evaluation surface. The same Claude Code workflow has at least eight others — and some of the most dangerous failures look like the output passing while the tool-use trajectory, file state, or skill trigger all failed silently. The right eval depends on which part of the workflow you are trying to trust."
target_audience: "Engineers, technical managers, and technical PMs who have read Part 1 and now want to understand what a complete evaluation picture looks like for a real Claude Code workflow. Comfortable with AI and software engineering; arriving from the mental model introduced in Part 1."
target_reading_time_minutes: 15
topics_to_cover:
  - "The evaluation map — all nine surfaces introduced via summary table, one sentence each"
  - "Skills and agent evals [deep dive] — trigger evals, execution evals, delta evals; A/B test skill as the anchor"
  - "Trajectory and tool-use evals [deep dive] — the tracer concept; did it read metrics.md before drafting or generate from memory; Read→Draft→Write sequence check"
  - "Repository state evals [deep dive] — git diff as an eval; expected file paths; no collateral changes; no leftover artifacts"
  - "Light tour of remaining six surfaces — final output (covered in Part 1), hooks, subagents, cost/latency, human usefulness"
  - "Closing map pull-back — the A/B test skill now has a full eval map; Part 3 builds the suite from one surface"
topics_to_exclude:
  - "How to build the full eval suite infrastructure (saved for Part 3)"
  - "Specific eval frameworks like RAGAS, Inspect, or LangSmith in depth"
  - "Cost/latency as a deep-dive section (light touch only; not DS-specific enough to warrant deep treatment here)"
  - "New running example — everything stays anchored to the A/B test experiment design doc from Part 1"
open_research_questions:
  - "Whether the Anthropic skills docs describe a mechanism for verifying trigger behaviour that we can cite directly"
  - "Whether git diff as an eval pattern has a published reference worth citing (or if it stands on its own as obvious)"

# ── Brainstorm output ─────────────────────────────────────────────────
brainstorm_summary: "Part 2 is the map post — its job is to give the reader a complete picture of evaluation surfaces before Part 3 delivers the implementation. The sharpest entry point is the callback to Part 1: the A/B test document eval passed, but three other things could have silently failed on that same run. From there, the post introduces all nine surfaces via a summary table (light landscape), then goes deep on three chosen for their relevance to data scientists: (1) skills and agent evals — the trigger/execution/delta taxonomy, directly applicable to any DS team using Claude Code skills for experiment workflows; (2) trajectory and tool-use evals — the tracer concept, did it read the right context file before generating, what sequence did it follow; (3) repository state evals — git diff as an eval, expected file paths, no collateral changes. The remaining six surfaces get one paragraph each. The YAML examples are used sparingly: one detailed example per deep-dive section (3 total), none in the light-touch section. Target is 15 min (~3,750 words). The A/B test experiment design doc is the single running example throughout — no new examples introduced."


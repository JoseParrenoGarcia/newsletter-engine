title: "Claude Code Plugins: How to Build, Version, and Maintain Them"
slug: claude-code-plugins
content_type: standalone-genai
structural_type: tutorial-guide
series_name: ""
series_position: ""

thesis: >
  Claude Code plugins are not a new capability — they are the packaging and distribution layer
  for everything you already build with CLAUDE.md, skills, hooks, MCP, and agents. This post
  explains what plugins actually are, walks through building one from scratch, and covers the
  operational side that nobody writes about: versioning, validation before release, and pushing
  updates to users.

target_audience: >
  Experienced Claude Code users who already use skills, hooks, and CLAUDE.md in their daily
  workflow and want to package and share their customisations across projects or with a team.

target_reading_time_minutes: 15

out_of_scope:
  - Installing plugins from the marketplace as an end user
  - MCP server development (covered separately)
  - Plugin security model in depth

open_research_questions:
  - What does a complete plugin.json manifest look like with all optional fields?
  - Are there any community-published plugins to reference as real examples?
  - How exactly does semantic versioning map to plugin update behaviour?
  - What CI tooling exists (if any) for plugin validation?


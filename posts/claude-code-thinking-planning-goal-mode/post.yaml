# ── Brainstorm output ─────────────────────────────────────────────────
brainstorm_summary: "A standalone Claude Code explainer driven by a personal discovery: José noticed reasoning effort level selectors in Claude Code but had no real intuition for what they did or whether the token cost was justified. Research into thinking levels opened into a broader realisation: thinking levels, planning mode, and goal mode are three distinct control surfaces that solve different problems, and conflating them is the source of most vague agent prompting. The post is organised around planning mode as the organising discipline — the insight being that plan mode is not just one feature among many, but the meta-discipline that gives thinking levels and model selection their context. Goal mode then extends that discipline to long-running autonomous work. The Codex comparison is deliberately light: a brief section showing this is an industry-wide direction, not Claude-specific vocabulary. The tone is personal and grounded — José shares planning mode as a practice that transformed his own workflow, not just a feature to explain. The reader should finish knowing: how to choose effort level, why to default to plan mode, and how to write a goal that actually has a finish line."


# ── Core content ──────────────────────────────────────────────────────
thesis: "Planning mode is the organizing discipline for working with coding agents — thinking levels and model selection are knobs you configure within it, and goal mode extends that discipline to long-running autonomous work."
target_audience: "Practitioners using or exploring Claude Code (including series readers) who want to understand the actual mechanics behind reasoning effort, plan mode, and goal mode — and stop treating them as interchangeable features or magic words."
target_reading_time_minutes: 15
topics_to_cover:
  - "Personal hook: curiosity about token cost of thinking level selectors → research into what they actually do"
  - "What thinking levels are: budgeted deliberation, not magic intelligence; the cost/quality/speed trade-off"
  - "When to use low vs high effort — examples from trivial inspection to ambiguous architecture work"
  - "Planning mode: separating design from execution; why agents fail by acting too early"
  - "Planning mode as José's default working practice — the case for making it yours too"
  - "Planning mode as the umbrella concept: it encapsulates model selection (Opus vs Sonnet), effort level, and pre-execution discipline"
  - "opusplan: Opus for planning, Sonnet for execution — the product expression of this idea"
  - "ultraplan: cloud-based plan review (brief mention as the newest addition)"
  - "Goal mode: the completion contract — keeps working until a verifiable condition is met"
  - "/goal vs /loop vs Stop hooks — the clean three-way comparison from the official docs"
  - "What makes a good goal: outcome + verification surface + constraints + boundaries + stop condition"
  - "Weak vs strong goal examples"
  - "Does Codex do the same? — brief comparison showing this is an industry-wide direction"
  - "When NOT to use each mode — builds trust with the reader"
  - "Practical patterns: four reusable patterns from low-effort inspect to plan → goal execution"
  - "Closing: agentic coding is workflow design — ties back to the series arc"
topics_to_exclude:
  - "Deep Codex vs Claude Code feature comparison — this is a Claude Code post; Codex is a brief cameo"
  - "ultrathink as the primary framing — frame as older community terminology, not current best practice"
  - "Full autonomy / AI safety debates"
  - "Claude Agent SDK or MCP-level orchestration"
  - "Thinking levels as a way to force correctness — they are a budget, not a guarantee"
open_research_questions:

# ── Core content ──────────────────────────────────────────────────────
thesis: "Agents are not skills — they are isolated execution contexts with their own context window, prompt, tools, and permissions. One agent is simple and approachable; full multi-agent orchestration exists but belongs in a separate conversation."
target_audience: "Practitioners close to the tech who have not yet tried Claude Code agents and want to fully understand what they are, how they differ from skills, and when to use them."
target_reading_time_minutes: 15
topics_to_cover:
  - "Naming clarification: in Claude Code, the custom agent primitive is subagents (not agent teams, not Agent SDK)"
  - "Why agents exist: context isolation, specialisation, and parallelism when relevant"
  - "Minimal mental model: an isolated worker with its own context window, prompt, tools, and permissions"
  - "Anatomy of a subagent: the AGENT.md file, required and optional frontmatter fields, directory location"
  - "Agents vs skills: the core distinction (isolated worker vs reusable knowledge/workflow in main context)"
  - "Best practices: description quality, tool restriction, single focus, verification"
  - "Light touch on agent teams: what they are, when they help, experimental status"
  - "When agents are the wrong tool"
topics_to_exclude:
  - "Deep multi-agent orchestration patterns and architectures"
  - "Fully orchestrated multi-agent systems (orchestrator–worker, swarms, etc.)"
  - "Claude Agent SDK deep dive"
  - "Implementation of agent teams beyond a brief mention"
open_research_questions:
  - "Validate all 12 source URLs from the research notes (official docs may have moved or been updated)"
  - "Confirm current frontmatter fields for subagent AGENT.md — check if background, memory, skills fields are stable"
  - "Verify whether context:fork / agent: field in skills is still documented as described"

# ── Brainstorm output ─────────────────────────────────────────────────
brainstorm_summary: "Ground-up explainer of Claude Code subagents for practitioners who are close to the tech but have not yet tried the feature. The post teaches from first principles: what the feature is called, why it exists, what it looks like in practice, and how it fits alongside the other Claude Code primitives. The tone is calm and precise — it guides the reader to understanding rather than challenging their assumptions. It is closely related to the existing skills post and the memory/rules posts, but is fully standalone. Two-part core takeaway: (1) agents are not skills because they run in an isolated execution context with their own context window, prompt, tools, and permissions — skills inject reusable knowledge or workflow into the main context; (2) one agent is simple and approachable, full orchestration exists and is acknowledged, but belongs in a dedicated future post."

